# Publishes web/ (the Hoppla web page, test build) to https://swissfel.github.io/hoppla/
# Needs once: Settings > Pages > Source: GitHub Actions.
name: pages
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Stamp the build into the page
        run: |
          sed -i "s/__BUILD__/${GITHUB_SHA::7} $(date -u +%Y-%m-%d\ %H:%MZ)/g" web/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
