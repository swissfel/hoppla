# Tests on every push / pull request.
# Pushing a tag "vX.Y.Z" builds all binaries and publishes them as a GitHub Release;
# the README links to releases/latest/download/<file>, so asset names must stay fixed.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v

  # End-to-end: real ssh + Hoppla against the simulated hopx and Ra (tools/fake_hopx.py).
  simulate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install paramiko
      - name: Simulated hopx session
        run: |
          python tools/fake_hopx.py > fake.log 2>&1 &
          sleep 3
          python tools/simulate.py
          sleep 6
          HOPPLA_SIM_PASSWORD=wrong python tools/simulate.py | tee wrong.txt || true
          grep -q "Login failed" wrong.txt
      - if: always()
        run: cat fake.log

  binary:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [test, simulate]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install "pyinstaller>=6.10"
      - run: python build.py binary
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/hoppla-linux-*

  zipapp:
    needs: [test, simulate]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 build.py zipapp
      - uses: actions/upload-artifact@v4
        with:
          name: bin-pyz
          path: dist/hoppla.pyz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [binary, zipapp]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          merge-multiple: true
          path: dist
      - run: ls -la dist
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
