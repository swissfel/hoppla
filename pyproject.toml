[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hoppla"
dynamic = ["version"]
description = "Hoppla: SSH tunnels, a PSI browser and desktop icons for reaching PSI through the hopx gateway"
license = "MIT"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
hoppla = "hoppla.cli:main"

[project.gui-scripts]
hoppla-gui = "hoppla.cli:main"

[tool.setuptools]
packages = ["hoppla"]

[tool.setuptools.dynamic]
version = { attr = "hoppla.__version__" }
